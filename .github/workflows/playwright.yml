name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente (app ou local)
        required: true
        default: app
        type: choice
        options:
          - app
          - local
      project:
        description: Projeto Playwright (all, setup, public, authenticated)
        required: false
        default: authenticated
        type: string
      grep:
        description: Filtro -g
        required: false
        default: ''
        type: string
      workers:
        description: Workers
        required: false
        default: '1'
        type: string

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run playwright:install

      - name: Run Playwright tests
        env:
          E2E_TARGET: ${{ github.event.inputs.target || 'app' }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_ALLOW_REAL_BILLING: 'false'
        run: |
          ARGS="--workers=${{ github.event.inputs.workers || '1' }}"
          PROJECT="${{ github.event.inputs.project }}"
          if [ -n "$PROJECT" ] && [ "$PROJECT" != "all" ]; then
            ARGS="$ARGS --project=$PROJECT"
          fi
          GREP="${{ github.event.inputs.grep }}"
          if [ -n "$GREP" ]; then
            ARGS="$ARGS -g \"$GREP\""
          fi
          node scripts/e2e-run.mjs "${{ github.event.inputs.target || 'app' }}" -- $ARGS

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
